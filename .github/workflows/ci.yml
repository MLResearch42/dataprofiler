name: CI

on:
  push:
    branches: [develop, main, modernize]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }} / ${{ matrix.deps }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
        deps: [latest]
        include:
          # the oldest versions pyproject.toml allows
          - os: ubuntu-latest
            python: "3.10"
            deps: oldest
          - os: macos-latest
            python: "3.12"
            deps: latest
          - os: windows-latest
            python: "3.12"
            deps: latest
    steps:
      - uses: actions/checkout@v4

      # Creates a virtual environment with the requested Python and activates it
      # for the following steps (uv refuses to install into its managed Pythons).
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
          activate-environment: true
          cache-dependency-glob: pyproject.toml

      - name: Install (latest dependencies)
        if: matrix.deps == 'latest'
        run: uv pip install -e ".[dev]"

      - name: Install (oldest supported dependencies)
        if: matrix.deps == 'oldest'
        run: uv pip install --resolution lowest-direct -e ".[dev]"

      - name: Lint
        if: matrix.deps == 'latest' && matrix.python == '3.12' && runner.os == 'Linux'
        run: ruff check dataprep

      - name: Test
        run: pytest -n auto --cov=dataprep --cov-report=term-missing:skip-covered

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          cache-dependency-glob: pyproject.toml
      - name: Build sdist and wheel
        run: uv build
      - name: Check the distribution metadata
        run: uvx twine check --strict dist/*
      - name: Install the wheel into a clean environment and smoke test it
        run: |
          uv venv /tmp/clean-env
          uv pip install --python /tmp/clean-env/bin/python dist/*.whl
          /tmp/clean-env/bin/python -c "import dataprep, dataprep.eda, dataprep.clean; print(dataprep.__version__)"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
