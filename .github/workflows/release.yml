name: Release

# Publishes to PyPI when a GitHub release is published (tag it e.g. v0.5.0).
# Uses PyPI "trusted publishing": no API token is stored in the repository.
# One-time setup on pypi.org: add this repository and the "pypi" environment
# as a trusted publisher for the dataprep-next project.

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv build
      - run: uvx twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
